services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mnemosyne
      POSTGRES_USER: mnemosyne
      POSTGRES_PASSWORD: mnemosyne
    ports:
      - "5432:5432"
    volumes:
      - mnemosyne_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemosyne -d mnemosyne"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://mnemosyne:mnemosyne@db:5432/mnemosyne
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: uvicorn mnemosyne.api.app:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://mnemosyne:mnemosyne@db:5432/mnemosyne
      API_KEY: ${API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-minilm}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - mnemosyne_documents:/app/documents
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: python -m mnemosyne.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://mnemosyne:mnemosyne@db:5432/mnemosyne
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-minilm}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    volumes:
      - mnemosyne_documents:/app/documents
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  mnemosyne_db:
  mnemosyne_documents:

